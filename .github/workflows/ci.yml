name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "AEP monitor-medicamentos"

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: "AEP monitor-medicamentos/pom.xml"

      # mvn verify roda os testes, gera o relatório JaCoCo e FALHA o build
      # se a cobertura de linhas ficar abaixo de 70% (regra configurada no pom.xml).
      - name: Rodar testes e validar cobertura mínima (70%)
        run: mvn -B verify

      - name: Publicar relatório de cobertura como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-jacoco
          path: "AEP monitor-medicamentos/target/site/jacoco/"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Compilar (tsc + vite build)
        run: npm run build
